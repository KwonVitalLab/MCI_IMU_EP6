# ================== Data Path ==================
data_paths:
  source_file: "SourceData/ALL_COHORTS_combined_clean_data.csv"
  cohort_midpoints_file: "MetaData/cohort_midpoints.csv"
  processed_path: "processed"
  feature_path: "processed/features"
  label_path: "LabelData"

# ================== Result Path ==================
result_paths:
  models_path: "results/trained_models"
  figure_path: "results/figures"
  output_path: "results/performance"
  shap_path: "results/shap"
  fairness_path: "results/fairness"


# ================== Score targets ==================
moca_early_targets:
  - "MoCA"

minibest_early_targets:
  - "Minibest Baseline"

minibest_sub_early_targets:
  - 'b_minibest_mot_anticipatory_left'
  - 'b_minibest_mot_anticipatory_right'
  - 'b_minibest_mot_reactactive postural control_left'
  - 'b_minibest_mot_reactactive postural control_right'
  - 'b_minibest_mot_sensory orientation'
  - 'b_minibest_mot_dynamic gait'

moca_late_targets:
  - 'MoCA Post'

moca_sub_late_targets:
  - 'Memory Score'
  - 'Executive Score'
  - 'Attention / Concentration Score'
  - 'Language Score'
  - 'Visuospatial Score'
  - 'Orientation Score'

minibest_late_targets:
  - 'Minibest Exit'

minibest_sub_late_targets:
  - 'e_minibest_mot_anticipatory_left'
  - 'e_minibest_mot_anticipatory_right'
  - 'e_minibest_mot_reactactive postural control_left'
  - 'e_minibest_mot_reactactive postural control_right'
  - 'e_minibest_mot_sensory orientation'
  - 'e_minibest_mot_dynamic gait'

# ====================== Feature Extractions configurations ======================
sliding_window:
  window_size: 100
  stride: 50
  gap_threshold: 60
  fs: 23

gait_features:
  stance_thresh: 0.5
  min_stance_samples: 3
  alpha: 5.0

female_estimated_leg_length: 0.708
male_estimated_leg_length: 0.788

sensitive_cols:
  - 'Sex'
  - 'Race'

# ====================== ML pipeline ======================
random_seed: 42
confidence_level: 0.95
folds: 5
reps: 5
n_trials: 50

moca_targets:
  - "MoCA" 
  - 'Memory_Score'
  - 'Executive_Score'
  - 'Attention_Concentration_Score'
  - 'Language_Score'
  - 'Visuospatial_Score' 
  - 'Orientation_Score'

minibest_targets:
  - "Minibest" 
  - 'Anticipatory_Left'
  - 'Anticipatory_Right' 
  - 'Reactactive_Postural_Control_Left' 
  - 'Reactactive_Postural_Control_Right' 
  - 'Sensory_Orientation' 
  - 'Dynamic_Gait'

moca_exclude: 
  - "MoCA" 
  - 'Memory_Score'
  - 'Executive_Score'
  - 'Language_Score'
  - 'Visuospatial_Score' 
  - 'Orientation_Score'
  - 'Attention_Concentration_Score'

minibest_exclude:
  - "Minibest" 
  - 'Anticipatory_Left'
  - 'Anticipatory_Right' 
  - 'Reactactive_Postural_Control_Left' 
  - 'Reactactive_Postural_Control_Right' 
  - 'Sensory_Orientation' 
  - 'Dynamic_Gait'

exclude_cols:
  - 'Cohort'
  - 'Subject'
  - 'VisitIndex'
  - 'CohortProgramDay'
  - 'Window Start TimeOfDay'
  - 'Window Start Elapsed (s)'
  - 'Time'

optuna_patience: 10

params_search_space:
  RandomForest:
    n_estimators: 
      type: 'int'
      range: [100, 300]
    max_depth: 
      type: 'int'
      range: [5, 20]
    min_samples_leaf: 
      type: 'int'
      range: [10, 100]
      log: True
    max_features:
      type: 'categorical'
      range: ['sqrt', 0.8]
    max_samples:
      type: 'float'
      range: [0.5, 0.9]

  XGBoost:
    n_estimators:
      type: 'int'
      range: [200, 1000]
    learning_rate:
      type: 'float'
      range: [0.01, 0.1]
      log: True
    max_depth:
      type: 'int'
      range: [3, 9]
    min_child_weight:
      type: 'int'
      range: [1, 10]
    subsample:
      type: 'float'
      range: [0.6, 1.0]
    colsample_bytree:
      type: 'float'
      range: [0.6, 1.0]
    reg_lambda:
      type: 'float'
      range: [0.1, 10.0]
      log: True
    reg_alpha:
      type: 'float'
      range: [1.0e-8, 1.0]
      log: True

  CatBoost:
    iterations:
      type: 'int'
      range: [200, 1000]
    learning_rate:
      type: 'float'
      range: [0.01, 0.1]
      log: True
    depth:
      type: 'int'
      range: [4, 10]
    l2_leaf_reg:
      type: 'float'
      range: [1.0, 10.0]
      log: True
    subsample:
      type: 'float'
      range: [0.6, 1.0]
    random_strength:
      type: 'float'
      range: [1.0, 5.0]
      log: True

test_size: 0.2
